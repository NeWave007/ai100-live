<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 100 · 活动访问</title><style>body{margin:0;background:#00121e;color:#eaf7f5;font-family:system-ui,'Microsoft YaHei';min-height:100vh;display:grid;place-items:center}main{width:min(370px,80vw);padding:30px;border:1px solid #26515b;border-radius:16px;background:#0b2933}h1{color:#e6ff51;font-size:27px}p{color:#a7c5cb;line-height:1.7}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:7px;font-size:16px}input{background:#00121e;color:white;border:1px solid #42737e}button{background:#d9f650;border:0;cursor:pointer}small{color:#9ebac0}</style><main><small>AI 100 / 01 · SHENZHEN</small><h1>真话碰杯局</h1><p>请输入现场提供的访问密码。<br>Enter the event access password.</p><form id="login"><label for="password">访问密码 / Password</label><input id="password" type="password" required maxlength="128" autocomplete="off"><button id="enter">进入 / Enter</button></form><p id="message" role="status">仅供活动交流使用 · Event access only</p></main><script>
const unbase64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('enter'),message=document.getElementById('message');button.disabled=true;message.textContent='正在验证…';let password=document.getElementById('password').value;try{const response=await fetch('./payload.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('network');const p=await response.json();const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);password='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unbase64(p.salt),iterations:p.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(p.iv)},key,unbase64(p.ciphertext));document.open();document.write(new TextDecoder().decode(clear));document.close();}catch(error){message.textContent=error.name==='OperationError'?'密码不正确，请重试。':'暂时无法加载，请检查网络后重试。';button.disabled=false;}});
</script></html>
